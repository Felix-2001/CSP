<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kuivasjärven Rantasaunat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <nav class="navbar">
        <ul class="nav-list">
            <li class="nav-item"><a href="index.html">Homepage</a></li>
			<li class="nav-item"><a href="listing.html">Listings</a></li>
             <li class="nav-logo"><a href="index.html"><img src="images/logo-icon.svg" alt="Kuivasjärven Rantasaunat, to the homepage"></a></li>

            <li class="nav-item"><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    </header>
    <main>
      <div class="contact-container">
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
                <div class="contact-left-title">
                    <h1>Contact Us!</h1>
                    <hr>
                </div>
                <input type="hidden" name="access_key" value="15ca491f-cb7a-4439-8b55-af477f0ef5aa">
                <input type="text" name="name" placeholder="Your Name" class="contact-input" required>
                <input type="text" name="E-mail" placeholder="Your Email" class="contact-input" required>
                <textarea name="Message" placeholder="Your Message to us!" class="contact-input" required></textarea>
                <button type="submit">Confirm</button>
            </form>
            <div class="contact-right">
                <img src="images/kontakt-sauna.png" alt="Envelope with a speech bubble: send us a message">
            </div>
        </div>
    </main>
    <footer class="site-footer">
	<a href="https://www.instagram.com/">
		<img src="images/logowo.png" alt="Instagram" class="instagram">
	</a>
	<ul class="footer-links">
